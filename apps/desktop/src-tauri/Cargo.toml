[package]
name = "countries-and-resources"
version = "0.1.0"
description = "Countries & Resources: life simulation and nation-building game"
edition = "2021"

[lib]
name = "countries_and_resources_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
