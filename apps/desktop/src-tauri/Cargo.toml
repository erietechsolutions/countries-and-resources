[package]
name = "countries-and-resources"
version = "0.2.0"
description = "Countries & Resources: life simulation and nation-building game"
edition = "2021"

[lib]
name = "countries_and_resources_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2.4"

# Self-updates from GitHub Releases (desktop only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
