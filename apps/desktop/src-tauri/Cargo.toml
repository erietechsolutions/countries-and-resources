[package]
name = "countries-and-resources"
version = "0.3.2"
description = "Countries & Resources: life simulation and nation-building game"
edition = "2021"

[lib]
name = "countries_and_resources_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Used by the code tauri::generate_context! emits for plugin configuration.
serde_json = "1"
tauri-plugin-process = "2.4"

# Self-updates from GitHub Releases (desktop only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"

# Thin LTO and parallel codegen keep release builds fast; the app is a thin shell around the web
# build, so full LTO would only shave a little off the binary size.
[profile.release]
lto = "thin"
opt-level = "s"
strip = true
